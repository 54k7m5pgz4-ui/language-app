<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Language App</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 420px;
        padding: 2rem;
      }
      h1 { font-size: 2rem; margin-bottom: 1rem; }
      p { margin-bottom: 1rem; color: #94a3b8; }
      a { color: #818cf8; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Offline-Modus</h1>
      <p>Die App ist derzeit nicht verbunden. Du kannst weiterhin den zuletzt geladenen Inhalt im Offline-Modus nutzen.</p>
      <p>Bitte prüfe deine Internetverbindung und lade die Seite neu, sobald du wieder online bist.</p>
      <p><a href="/">Zurück zur App</a></p>
    </div>
  </body>
</html>
